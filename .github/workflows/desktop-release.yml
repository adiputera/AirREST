name: Release AirREST Desktop

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave blank to use desktop-v__VERSION__ from tauri.conf.json)'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKitGTK & AppImage tools)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve Release Tag Name
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=desktop-v__VERSION__" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject Updater Public Key into tauri.conf.json
        if: env.TAURI_UPDATER_PUBLIC_KEY != ''
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY.trim();
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          '

      - name: Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.release_meta.outputs.tag_name }}
          releaseName: 'AirREST Desktop v__VERSION__'
          releaseBody: 'Download the AirREST Desktop installer for your operating system below.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

