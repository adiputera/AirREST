name: Release AirREST (Desktop & Android)

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave blank to use desktop-v__VERSION__ from tauri.conf.json)'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKitGTK & AppImage tools)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/native/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve Release Tag Name
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=desktop-v__VERSION__" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          node scripts/extract-release-notes.mjs "${{ steps.release_meta.outputs.tag_name }}"

      - name: Configure Updater Signing in tauri.conf.json
        if: env.TAURI_UPDATER_PUBLIC_KEY != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "apps/native/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.bundle.createUpdaterArtifacts = true;
            conf.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY.trim();
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          '

      - name: Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          projectPath: apps/native
          tagName: ${{ steps.release_meta.outputs.tag_name }}
          releaseName: 'AirREST v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.release_notes }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-android:
    needs: publish-tauri
    if: always() && (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/native/src-tauri -> target'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve Release Metadata
        id: release_meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/native/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android Signing Keystore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${{ secrets.AIRREST_ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using configured repository secrets for Android signing..."
            echo "${{ secrets.AIRREST_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/airrest-release.keystore"
            echo "AIRREST_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/airrest-release.keystore" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEYSTORE_PASSWORD=${{ secrets.AIRREST_ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEY_ALIAS=${{ secrets.AIRREST_ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEY_PASSWORD=${{ secrets.AIRREST_ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::AIRREST_ANDROID_KEYSTORE_BASE64 secret not found; generating temporary CI fallback keystore so APK is installable."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore/airrest-release.keystore" \
              -alias "airrest-ci" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "airrestpass123" -keypass "airrestpass123" \
              -dname "CN=AirREST CI, O=AirREST, C=ID"
            echo "AIRREST_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/airrest-release.keystore" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEYSTORE_PASSWORD=airrestpass123" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEY_ALIAS=airrest-ci" >> "$GITHUB_ENV"
            echo "AIRREST_ANDROID_KEY_PASSWORD=airrestpass123" >> "$GITHUB_ENV"
          fi

      - name: Build ARM64 Release APK and Universal AAB
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          npm run --prefix apps/native tauri -- android build --apk --aab --target aarch64 --ci
          mkdir -p apps/native/src-tauri/target/release-assets
          cp apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "apps/native/src-tauri/target/release-assets/airrest-${{ steps.release_meta.outputs.version }}-android-arm64.apk"
          cp apps/native/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab \
            "apps/native/src-tauri/target/release-assets/airrest-${{ steps.release_meta.outputs.version }}-android-universal.aab"

      - name: Build x86_64 Release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          npm run --prefix apps/native tauri -- android build --apk --target x86_64 --ci
          cp apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "apps/native/src-tauri/target/release-assets/airrest-${{ steps.release_meta.outputs.version }}-android-x86_64.apk"

      - name: Verify APK Signatures and 16 KiB Alignment
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose apps/native/src-tauri/target/release-assets/*.apk
          python3 scripts/check-android-page-size.py \
            "apps/native/src-tauri/target/release-assets/airrest-${{ steps.release_meta.outputs.version }}-android-arm64.apk" \
            --readelf "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          python3 scripts/check-android-page-size.py \
            "apps/native/src-tauri/target/release-assets/airrest-${{ steps.release_meta.outputs.version }}-android-x86_64.apk" \
            --readelf "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airrest-android-release
          path: apps/native/src-tauri/target/release-assets/*
          if-no-files-found: error

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          node scripts/extract-release-notes.mjs "${{ steps.release_meta.outputs.tag_name }}"

      - name: Attach Android APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && steps.release_meta.outputs.tag_name != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          body: ${{ steps.changelog.outputs.release_notes }}
          generate_release_notes: true
          files: apps/native/src-tauri/target/release-assets/*
