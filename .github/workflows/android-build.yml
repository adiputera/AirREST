name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/native/**'
      - 'packages/common/**'
      - 'scripts/android-back-navigation.test.mjs'
      - 'scripts/tauri-file-adapter.test.mjs'
      - 'scripts/tauri-http-scope.test.mjs'
      - 'scripts/check-android-page-size.py'
      - 'scripts/android-emulator-smoke.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/native/src-tauri -> target'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Test Android navigation and file adapter
        run: npm run test:android-back && npm run test:android-update && npm run test:tauri-files && npm run test:tauri-http-scope
      - name: Build emulator APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npm run build:android:emulator -- --ci
      - name: Check 16 KiB native and APK alignment
        run: >-
          python3 scripts/check-android-page-size.py
          apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          --readelf "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/android-emulator-smoke.py apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: airrest-android-x86_64-debug
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
