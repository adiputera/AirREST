        key:
          type: string
          example: 'baseUrl'
        value:
          type: string
          description: Initial value shared and synced with cloud workspace
          example: 'http://localhost:8080'
        initial_value:
          type: string
          description: Optional initial value alias for compatibility
          example: 'http://localhost:8080'
        enabled:
          type: boolean
          example: true

    Environment:
      type: object
      required:
        - id
        - name
        - variables
        - min_role
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '99999999-9999-9999-9999-999999999999'
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: 'Development Local'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        min_role:
          $ref: '#/components/schemas/ProjectRole'
        version:
