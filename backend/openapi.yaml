openapi: 3.1.0
info:
  title: AirREST Backend API Contract
  version: 1.1.2
  description: |
    # AirREST Cloud Backend API Specification & Contract

    This document defines the formal API Contract for the AirREST backend synchronization and collaboration service.
    Any backend implementation (written in Go, Node.js/TypeScript, Python, Java, Rust, C#, PHP, etc.) that complies
    with this specification will work as an immediate drop-in replacement for:
    - **AirREST Chrome Extension** (DevTools / Popup REST client)
    - **AirREST Hub** (Web-based workspace and team collaboration dashboard)

    ---

    ## Key Architectural Principles

    ### 1. Standard Response Envelope
    All HTTP endpoints return responses wrapped in a consistent Envelope structure:
    ```json
    {
      "success": true,
      "data": { ... }
    }
    ```
    On errors:
    ```json
    {
      "success": false,
      "error": "Human-readable error description",
      "code": "ERROR_CODE_STRING"
    }
    ```

    ### 2. Authentication & Silent Rolling Refresh
    - Authenticated endpoints require `Authorization: Bearer <access_token>`.
    - Access tokens are JWTs (HS256) valid for 72 hours.
    - Refresh tokens are rolling 30-day tokens.
    - When the client receives HTTP `401 Unauthorized`, it transparently calls `POST /api/v1/auth/refresh`
      with `{ "refresh_token": "..." }` and retries the original request upon renewal.

    ### 3. Optimistic Concurrency Control (OCC)
    - Mutable entities (`collections`, `collection_items`, `environments`) include a numeric `version` (int64).
    - When updating, clients send `base_version`.
    - If `base_version != current_server_version`, the server aborts the write and returns HTTP `409 Conflict`:
      ```json
      {
        "success": false,
        "error": "conflict: item has been modified by another user",
        "code": "CONFLICT",
        "data": { ...latest_server_object... }
      }
      ```

    ### 4. Soft-Deletes & Tombstone Deltas
    - Deletions are soft-deletes setting `deleted_at = NOW()`.
    - `GET /api/v1/sync/pull?since=<timestamp>` returns active items AND deleted items (`deleted_at != null`)
      so that distributed clients purge deleted entities locally and never re-upload them as zombies.

    ### 5. Hierarchical RBAC & Project Isolation
    - **System Roles**: `superadmin`, `user`
    - **Team Roles**: `admin`, `member`
    - **Project Roles**: `admin`, `maintainer`, `contributor`, `reader`
    - **Project Isolation**: Non-superadmin users can only view or query projects to which they are explicitly assigned.
    - **Granular Permissions**: Collections and Environments support `min_role` (`admin`, `maintainer`, `contributor`, `reader`).
      Users with a project role below `min_role` are prohibited from reading or writing that resource.

    ### 6. CORS Requirements
    The backend MUST support CORS with:
    - Allowed Origins: `*` or user-configured hosts, including `chrome-extension://*`
    - Allowed Methods: `GET, POST, PUT, PATCH, DELETE, OPTIONS`
    - Allowed Headers: `Accept, Authorization, Content-Type, X-CSRF-Token`
    - Exposed Headers: `Link`
    - Allow Credentials: `true`

    ### Session revocation and resource limits
     Both access and refresh JWTs carry a nonnegative integer token_version matching users.token_version. Missing or stale versions are rejected with 401. Password changes and administrator resets atomically increment the version and revoke existing sessions. A self-service password change returns a replacement token pair for the current device; administrator resets revoke every target-device session. Profile changes do not revoke sessions. Refresh tokens can be reused until expiry or account-wide revocation; they are not single-use. Clients clear tokens and sign in again after a rejected refresh.
     Requests are limited to 4 MiB (including chunked bodies), 16 concurrent handlers per instance, and 30 seconds. Oversized bodies return 413 PAYLOAD_TOO_LARGE. Saturation returns 503 SERVER_BUSY with Retry-After: 1; timeouts return 503 REQUEST_TIMEOUT. Proxy limits may be smaller. Serverless initialization attempts are serialized with a 20-second deadline and retries after 1, 2, 4, 8, 16, then 30 seconds; requests during attempts/backoff receive 503 and Retry-After: 1, retaining the nested SERVICE_UNAVAILABLE envelope.
    Contributors cannot delete collections/environments or move collections. Request/folder deletion is collection:write authoring. Moves require collection:move and min_role access in both project scopes; private scopes require ownership (superadmins bypass role/ownership restrictions).
servers:
  - url: http://localhost:8080
    description: Local development backend server
  - url: https://api.example.com
    description: Production Cloud API instance

tags:
  - name: Health & System
    description: Health monitoring and service status pings
  - name: Authentication & Profile
    description: User authentication, JWT token refresh, and user profile management
  - name: User Directory
    description: User search and directory lookup for team/project assignments
  - name: Workspaces
    description: Private workspaces management
  - name: Teams & Members
    description: Organization teams and team member management
  - name: Projects & Isolation
    description: Scoped projects within teams and project access control
  - name: Collections
    description: Request collection management, tree hierarchy, and reordering
  - name: Collection Items
    description: Individual folder and request items within collections
  - name: Environments
    description: Key-value environment variables and scoped configuration
  - name: Stateless Delta Sync
    description: Offline-to-cloud synchronization, delta pulls, batch pushes, and imports
  - name: Admin Management
    description: Superadmin user provisioning and password resets

paths:
  /:
    get:
      tags:
        - Health & System
      summary: Root Service Ping
      description: Returns service metadata and status.
      responses:
        '200':
          description: Service is online and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags:
        - Health & System
      summary: System Healthcheck
      description: Returns health status for server monitoring.
      responses:
        '200':
          description: System is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/health:
    get:
      tags:
        - Health & System
      summary: API v1 Healthcheck
      description: Returns API v1 health status.
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/register:
    post:
      tags:
        - Authentication & Profile
      summary: Register a new user
      description: |
        Registers a new user account. In default enterprise/secure mode, public registration may return
        HTTP 403 Forbidden with `code: "REGISTRATION_DISABLED"` when provisioning is restricted to Superadmins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Validation error or invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Public registration disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication & Profile
      summary: Authenticate user
      description: Authenticates user credentials and returns signed access token and 30-day rolling refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication & Profile
      summary: Refresh access token
      description: "Validates an HS256 JWT with token_type=refresh, issuer airrest-api, expiration, and token_version matching the user. Returns a renewed token pair. Old, missing-version, revoked, or invalid refresh tokens return 401 INVALID_REFRESH_TOKEN. Renewal does not invalidate the previous refresh token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/me:
    get:
      tags:
        - Authentication & Profile
      summary: Get current authenticated user
      description: Returns the user profile associated with the Bearer JWT token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/profile:
    put:
      tags:
        - Authentication & Profile
      summary: Update user profile
      description: Updates display name and optional avatar URL for current authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password:
    put:
      tags:
        - Authentication & Profile
      summary: Change password
      description: "Verifies the current password and atomically updates the password and session version. It returns a replacement access/refresh pair for this device while invalidating every previously issued token. A concurrent credential change rejects the stale password update with 400 INVALID_CURRENT_PASSWORD."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully and replacement tokens issued for the current device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Incorrect current password or password too short.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/search:
    get:
      tags:
        - User Directory
      summary: Search registered users
      description: Search registered users by email or name (minimum 2 characters). Used for team/project assignments.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
          description: Email search query
        - in: query
          name: q
          schema:
            type: string
          description: General search query (alias for email query)
      responses:
        '200':
          description: Matching users list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces:
    get:
      tags:
        - Workspaces
      summary: List user's private workspaces
      description: Retrieves all private workspaces owned by the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workspaces list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Workspaces
      summary: Create a private workspace
      description: Creates a new private workspace for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
      responses:
        '201':
          description: Workspace created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{id}:
    get:
      tags:
        - Workspaces
      summary: Get workspace details
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '404':
          description: Workspace not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Workspaces
      summary: Update workspace details
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
      responses:
        '200':
          description: Workspace updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Workspaces
      summary: Delete workspace
      description: Deletes private workspace. The initial default workspace cannot be deleted.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams:
    get:
      tags:
        - Teams & Members
      summary: List accessible teams
      description: Lists teams of which the user is a member (or all teams if caller is Superadmin).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Teams list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Teams & Members
      summary: Create team
      description: Creates a new organization team. Restricted to Superadmin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Team created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '403':
          description: Superadmin privileges required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{id}:
    get:
      tags:
        - Teams & Members
      summary: Get team details
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Teams & Members
      summary: Update team details
      description: Updates team name and description. Restricted to Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '200':
          description: Team updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Teams & Members
      summary: Delete team
      description: Permanently deletes team and related projects. Restricted to Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{id}/members:
    get:
      tags:
        - Teams & Members
      summary: List team members
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team members list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberListEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Teams & Members
      summary: Add or update team member
      description: Adds a user to the team or updates their role (`admin` or `member`). Requires Team Admin or Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
      responses:
        '200':
          description: Member added or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{id}/members/{userId}:
    delete:
      tags:
        - Teams & Members
      summary: Remove member from team
      description: Removes user from team and unassigns them from projects inside the team. Requires Team Admin or Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{teamId}/projects:
    get:
      tags:
        - Projects & Isolation
      summary: List team projects
      description: |
        Lists projects in team that are visible to the authenticated user.
        **Project Isolation rule**: Unassigned projects are completely hidden unless the caller is Superadmin or Team Admin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Projects list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Projects & Isolation
      summary: Create project in team
      description: Creates a new project in the team. Requires Team Admin or Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/projects/{id}:
    get:
      tags:
        - Projects & Isolation
      summary: Get project details
      description: Retrieves project details and the caller's effective `user_role`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Projects & Isolation
      summary: Update project details
      description: Requires Project Admin, Team Admin, or Superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
