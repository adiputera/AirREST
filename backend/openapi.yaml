          nullable: true
        graphql_variables:
          type: string
          nullable: true
        body_form_data:
          type: array
          items:
            type: object
        pre_request_script:
          type: string
          nullable: true
        post_response_script:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          example: 1
        last_modified_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        items:
