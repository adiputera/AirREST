                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Concurrent import collision; retry complete import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/users:
    get:
      tags:
        - Admin Management
      summary: List all registered users (Superadmin only)
      description: Lists all users across the entire platform.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '403':
          description: Superadmin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Admin Management
      summary: Provision new user account (Superadmin only)
      description: Creates a user account with a specified system role (`superadmin` or `user`).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: User provisioned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '409':
          description: User with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/users/{userId}/password:
    put:
      tags:
        - Admin Management
      summary: Reset user password (Superadmin only)
      description: "Resets the target user's password and atomically increments their session version, revoking all their access and refresh tokens. Resetting your own password also signs out the current session."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/users/{userId}:
    delete:
      tags:
        - Admin Management
      summary: Permanently delete a user account (Superadmin only)
      description: Permanently removes a user account, their private workspaces, and cascades memberships while safely reassigning created teams and projects to the executing superadmin.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: Cannot delete own account or last superadmin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated or deactivated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden (Superadmin required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256 access JWT from login. Required claims: user_id (UUID), email, role, token_type=access, token_version (nonnegative int64), iss=airrest-api, exp; issued tokens also include iat. Database system role and token_version are authoritative. Both access and refresh JWTs carry a nonnegative integer token_version matching users.token_version. Missing or stale versions are rejected with 401. Password changes and administrator resets atomically increment the version and revoke existing tokens. A self-service password change returns a replacement pair for the current device; administrator resets revoke every target-device session. Profile changes do not revoke sessions. Refresh tokens can be reused until expiry or account-wide revocation; they are not single-use. Clients clear tokens and sign in again after a rejected refresh."

  schemas:
    # ------------------ Core Enums ------------------
    SystemRole:
      type: string
      enum: [superadmin, user]
      example: user

    TeamRole:
      type: string
      enum: [admin, member]
      example: admin

    ProjectRole:
      type: string
      enum: [admin, maintainer, contributor, reader]
      example: contributor

    ItemType:
      type: string
      enum: [folder, request]
      example: request

    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
      example: GET

    BodyType:
      type: string
      enum: [none, json, xml, raw, x-www-form-urlencoded, form-data, binary, graphql]
      example: json

    RawType:
      type: string
      enum: [text, json, xml, html]
      example: json

    # ------------------ Envelopes ------------------
    SystemStatusResponse:
      type: object
      properties:
        service:
          type: string
          example: AirREST Cloud API
        status:
          type: string
          example: running
        serverless:
          type: boolean
          example: false
        time:
          type: string
          format: date-time
          example: '2026-10-22T09:00:00Z'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: AirREST Cloud API
        serverless:
          type: boolean
          example: false
        time:
          type: string
          format: date-time
          example: '2026-10-22T09:00:00Z'

    MessageEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: Operation completed successfully

    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid credentials or access forbidden
        code:
          type: string
          example: OPERATION_FAILED

    ConflictEnvelope:
      type: object
      required:
        - success
        - error
        - code
        - data
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "conflict: item has been modified by another user"
        code:
          type: string
          example: CONFLICT
        data:
          description: The latest server version of the conflicting object.
          type: object

    AuthResponseData:
      type: object
      required:
        - user
        - token
        - refresh_token
        - expires_at
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: d3b07384d113edec49eaa6238ad5ff00...
        expires_at:
          type: string
          format: date-time
          example: '2026-10-25T09:00:00Z'

    AuthEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthResponseData'

    UserEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    UserListEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    WorkspaceEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Workspace'

    WorkspaceListEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    TeamEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Team'

    TeamListEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'

    TeamMemberListEnvelope:
      type: object
      required:
