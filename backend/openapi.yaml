          type: string
          example: 'User Service API'
        description:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_role:
          $ref: '#/components/schemas/ProjectRole'
        permissions:
          type: array
          description: Granular capability-based permissions computed from user role
          items:
            type: string
          example: ['collection:read', 'collection:write']

    ProjectMember:
      type: object
      required:
        - id
        - project_id
        - user_id
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ProjectRole'
        permissions:
          type: array
          description: Granular capability-based permissions computed from member role
          items:
            type: string
          example: ['collection:read', 'collection:write']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    Collection:
      type: object
      required:
        - id
        - name
        - min_role
        - version
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '77777777-7777-7777-7777-777777777777'
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: 'Authentication Endpoints'
        description:
          type: string
          nullable: true
          example: 'User authentication and tokens'
        min_role:
          $ref: '#/components/schemas/ProjectRole'
        version:
          type: integer
          format: int64
          example: 1
        created_by:
          type: string
          format: uuid
        last_modified_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'

    KeyValuePair:
      type: object
      required:
        - id
        - key
        - value
        - enabled
      properties:
        id:
          type: string
          example: 'p1'
        key:
          type: string
          example: 'limit'
        value:
          type: string
          example: '10'
        enabled:
          type: boolean
          example: true
        description:
          type: string
          nullable: true

    AuthConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [none, bearer, basic, apikey]
          example: bearer
        bearerToken:
          type: string
          example: '{{token}}'
        basicUsername:
          type: string
        basicPassword:
          type: string
        apiKeyKey:
          type: string
        apiKeyValue:
          type: string
        apiKeyIn:
          type: string
          enum: [header, query]

    CollectionItem:
      type: object
      required:
        - id
        - collection_id
        - type
        - name
        - sort_order
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '88888888-8888-8888-8888-888888888888'
        collection_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
