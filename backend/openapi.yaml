  responses:
    PayloadTooLarge:
      description: 'PAYLOAD_TOO_LARGE: body exceeds 4194304 bytes. Sync/import may also return BATCH_LIMIT_EXCEEDED
        before writes.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 'SERVER_BUSY (Retry-After: 1), REQUEST_TIMEOUT, or serverless SERVICE_UNAVAILABLE (Retry-After:
        1). Initialization retries with bounded exponential backoff.'
      headers:
        Retry-After:
          description: Present for saturation/initialization; retry after at least one second.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - type: object
              required:
              - success
              - error
              properties:
                success:
                  const: false
                error:
                  type: object
                  required:
                  - code
                  - message
                  properties:
                    code:
                      const: SERVICE_UNAVAILABLE
                    message:
                      type: string
    Unauthorized:
      description: Missing/invalid/expired access token, missing token_version, or SESSION_REVOKED. Clear the session
        if refresh is rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
