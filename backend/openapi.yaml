          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    # ------------------ Sync & Delta Models ------------------
    SyncDeltaResult:
      type: object
      required:
        - collections
        - items
        - environments
        - server_time
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
        server_time:
          type: string
          format: date-time
          example: '2026-10-22T09:00:00Z'

    SyncCollectionMutation:
      type: object
      required:
        - action
        - collection
        - base_version
      properties:
        action:
          type: string
          enum: [create, update, delete]
        collection:
          $ref: '#/components/schemas/Collection'
        base_version:
          type: integer
          format: int64

    SyncItemMutation:
      type: object
      required:
        - action
        - item
        - base_version
      properties:
        action:
          type: string
          enum: [create, update, delete]
        item:
          $ref: '#/components/schemas/CollectionItem'
        base_version:
          type: integer
          format: int64

    SyncEnvironmentMutation:
      type: object
      required:
        - action
        - environment
        - base_version
      properties:
        action:
          type: string
          enum: [create, update, delete]
        environment:
          $ref: '#/components/schemas/Environment'
        base_version:
          type: integer
          format: int64

    SyncPushRequest:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        collections:
          type: array
          items:
            $ref: '#/components/schemas/SyncCollectionMutation'
          maxItems: 500
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncItemMutation'
          maxItems: 500
        environments:
          type: array
          items:
            $ref: '#/components/schemas/SyncEnvironmentMutation'

          maxItems: 500
      description: At most 500 mutations total across all three arrays.
      x-max-total-mutations: 500
      oneOf:
      - required:
        - workspace_id
        not:
          required:
          - project_id
      - required:
        - project_id
