<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AirREST Script Sandbox</title>
  </head>
  <body>
    <script>
      function isValidOrigin(origin) {
        if (!origin || typeof origin !== 'string' || origin === 'null') return false;
        if (origin.startsWith('chrome-extension://')) return true;
        if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin)) return true;
        return false;
      }

      window.addEventListener('message', function (event) {
        if (!event.source || event.source !== window.parent) return;
        if (!isValidOrigin(event.origin)) return;
        if (!event.data || typeof event.data !== 'object') return;
        const { id, script, response, environment = {}, variables = {} } = event.data;
        if (!id || !script) return;

        const currentEnv = Object.assign({}, environment);
        const currentVars = Object.assign({}, variables);

        function isForbiddenKey(k) {
          return k === '__proto__' || k === 'constructor' || k === 'prototype';
        }

        const pm = {
          environment: {
            get: function (k) { return currentEnv[k]; },
            set: function (k, v) {
              if (isForbiddenKey(k)) return;
              currentEnv[k] = String(v);
            },
            unset: function (k) { delete currentEnv[k]; },
            has: function (k) { return Object.prototype.hasOwnProperty.call(currentEnv, k); },
            toObject: function () { return Object.assign({}, currentEnv); }
          },
          variables: {
            get: function (k) { return currentVars[k] !== undefined ? currentVars[k] : currentEnv[k]; },
            set: function (k, v) {
              if (isForbiddenKey(k)) return;
              currentVars[k] = String(v);
            },
            toObject: function () { return Object.assign({}, currentVars); }
          },
          response: response ? {
            code: response.status,
            status: response.statusText,
            headers: response.headers || {},
            json: function () {
              return typeof response.data === 'object' && response.data !== null
                ? response.data
                : JSON.parse(response.data || '{}');
            },
            text: function () {
              return typeof response.data === 'string' ? response.data : JSON.stringify(response.data || '');
            },
            to: {
              have: {
                status: function (code) {
                  if (response.status !== code) {
                    throw new Error('Expected status code ' + code + ' but got ' + response.status);
                  }
                }
              }
            }
          } : undefined,
          test: function (name, fn) {
            try {
              if (typeof fn === 'function') fn();
            } catch (err) {
              let testErr = 'Test failed';
              try {
                testErr = (err && err.message) ? err.message : String(err);
              } catch {
                testErr = 'Test failed';
              }
              throw new Error('Test [' + name + '] failed: ' + testErr);
            }
          },
          expect: function (actual) {
            return {
              to: {
                be: function (expected) {
                  if (actual !== expected) throw new Error('Expected ' + expected + ' but got ' + actual);
                },
                equal: function (expected) {
                  if (actual != expected) throw new Error('Expected ' + expected + ' but got ' + actual);
                }
              }
            };
          }
        };

        // Legacy Postman API compatibility (postman.*, response, responseBody, responseCode, tests)
        const postman = {
          setEnvironmentVariable: function (k, v) {
            if (isForbiddenKey(k)) return;
            currentEnv[k] = String(v);
          },
          getEnvironmentVariable: function (k) { return currentEnv[k]; },
          clearEnvironmentVariable: function (k) { delete currentEnv[k]; },
          setGlobalVariable: function (k, v) {
            if (isForbiddenKey(k)) return;
            currentVars[k] = String(v);
          },
          getGlobalVariable: function (k) { return currentVars[k]; },
          clearGlobalVariable: function (k) { delete currentVars[k]; }
        };

        const rawBody = response
          ? (typeof response.data === 'string' ? response.data : JSON.stringify(response.data || ''))
          : '';
        const responseCode = response ? { code: response.status, name: response.statusText } : { code: 0, name: '' };
        const responseTime = response ? (response.timeMs || 0) : 0;
        const responseHeaders = response ? (response.headers || {}) : {};
        const tests = {};
        const targetOrigin = event.origin;

        try {
          const fn = new Function(
            'pm',
            'postman',
            'response',
            'responseBody',
            'responseCode',
            'responseTime',
            'responseHeaders',
            'tests',
            script
          );
          fn(pm, postman, rawBody, rawBody, responseCode, responseTime, responseHeaders, tests);
          if (event.source && typeof event.source.postMessage === 'function') {
            event.source.postMessage({
              id: id,
              success: true,
              environment: currentEnv,
              variables: currentVars
            }, targetOrigin);
          }
        } catch (err) {
          let errorMessage = 'Script execution failed.';
          try {
            if (err && typeof err.message === 'string') {
              errorMessage = err.message;
            } else if (err) {
              errorMessage = String(err);
            }
          } catch {
            errorMessage = 'Script execution failed.';
          }
          if (event.source && typeof event.source.postMessage === 'function') {
            event.source.postMessage({
              id: id,
              success: false,
              error: errorMessage,
              environment: currentEnv,
              variables: currentVars
            }, targetOrigin);
          }
        }
      });
    </script>
  </body>
</html>
